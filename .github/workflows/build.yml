name: Build NOVA Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        shell: bash
        run: |
          f=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$f" ]; then echo "::error::package.json not found"; exit 1; fi
          dir=$(dirname "$f")
          echo "APP_DIR=$dir" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund
      - name: Check required files
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          for p in src/main.js src/preload.js src/renderer/index.html build/icon.ico build/icon.png; do
            [ -f "$p" ] || { echo "::error::Missing $p"; exit 1; }
          done
      - name: Build installer
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Launcher-Setup
          path: ${{ env.APP_DIR }}/dist/NOVA-Launcher-Setup-*.exe
          if-no-files-found: error
